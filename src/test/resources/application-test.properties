# ===================================================================
# TEST PROFILE: isolated H2 database for @SpringBootTest integration tests
# ===================================================================
# app.jwt.secret is not set here: each test run generates a random key (see ApplicationIntegrationTest)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Tests create their own data; data.sql seed rows are not loaded
spring.sql.init.mode=never
