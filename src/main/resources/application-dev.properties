# ===================================================================
# DEV PROFILE: H2 IN-MEMORY DATABASE
# ===================================================================
spring.datasource.url=jdbc:h2:mem:studentdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Seed users (DataSeeder): passwords come from environment variables or from the
# git-ignored .env file in the project root; a user is skipped when unset
spring.config.import=optional:file:.env[.properties]
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.staff-password=${SEED_STAFF_PASSWORD:}
