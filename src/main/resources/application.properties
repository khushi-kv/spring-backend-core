# ===================================================================
# 1. APPLICATION CONFIGURATION & ACTIVE PROFILE
# ===================================================================
server.port=8080
spring.application.name=spring-boot-basics

# Active Profile: 'dev' (H2 in-memory DB) or 'prod' (PostgreSQL DB)
spring.profiles.active=dev

# ===================================================================
# 2. SWAGGER / OPENAPI 3 CONFIGURATION
# ===================================================================
# Custom path for Swagger UI (http://localhost:8080/swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs
# Enable Custom Theme Switcher (Light / Dark Toggle)
springdoc.swagger-ui.custom-css=/custom-swagger/swagger-theme.css
springdoc.swagger-ui.custom-js=/custom-swagger/theme-toggle.js

# ===================================================================
# 3. JWT AUTHENTICATION CONFIGURATION
# ===================================================================
# In production, injects JWT_SECRET from environment variable; falls back to dev key for local development
app.jwt.secret=${JWT_SECRET:dGhpcyBpcyBhIHN1cGVyIHNlY3VyZSBrZXkgZm9yIGp3dCB0b2tlbnMgMjAyNg==}
# In production, injects JWT_EXPIRATION from environment variable; defaults to 24 hours (86400000ms)
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

