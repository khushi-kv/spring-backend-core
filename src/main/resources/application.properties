# ===================================================================
# 1. APPLICATION CONFIGURATION & ACTIVE PROFILE
# ===================================================================
server.port=8080
spring.application.name=spring-boot-basics

# Active Profile: 'dev' (H2 in-memory DB) or 'prod' (PostgreSQL DB)
spring.profiles.active=dev

# ===================================================================
# 2. SWAGGER / OPENAPI 3 CONFIGURATION
# ===================================================================
# Custom path for Swagger UI (http://localhost:8080/swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs
# The Light / Dark theme (static/custom-swagger) is injected into Swagger UI by OpenApiConfig

# ===================================================================
# 3. JWT AUTHENTICATION CONFIGURATION
# ===================================================================
# Injected from the JWT_SECRET environment variable (no default: the app will not start without it).
# For local development, set JWT_SECRET in the git-ignored .env file (see .env.example)
app.jwt.secret=${JWT_SECRET}
# In production, injects JWT_EXPIRATION from environment variable; defaults to 24 hours (86400000ms)
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

