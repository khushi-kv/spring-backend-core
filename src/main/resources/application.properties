# ===================================================================
# 1. APPLICATION CONFIGURATION & ACTIVE PROFILE
# ===================================================================
server.port=8080
spring.application.name=spring-boot-basics

# Active Profile: 'dev' (H2 in-memory DB) or 'prod' (PostgreSQL DB)
spring.profiles.active=dev

# ===================================================================
# 2. SWAGGER / OPENAPI 3 CONFIGURATION
# ===================================================================
# Custom path for Swagger UI (http://localhost:8080/swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs
# Enable Custom Theme Switcher (Light / Dark Toggle)
springdoc.swagger-ui.custom-css=/custom-swagger/swagger-theme.css
springdoc.swagger-ui.custom-js=/custom-swagger/theme-toggle.js
