# ===================================================================
# 1. APPLICATION & SERVER CONFIGURATION
# ===================================================================
# Port where embedded Tomcat runs (Default: 8080)
server.port=8080
# Name of your Spring Boot Application
spring.application.name=spring-boot-basics

# ===================================================================
# 2. H2 IN-MEMORY DATABASE CONFIGURATION
# ===================================================================
# JDBC URL for H2 database (mem = in-memory RAM storage, studentdb = db name)
spring.datasource.url=jdbc:h2:mem:studentdb
# Database driver class for H2
spring.datasource.driverClassName=org.h2.Driver
# Default H2 username (sa = System Administrator) and empty password
spring.datasource.username=sa
spring.datasource.password=

# ===================================================================
# 3. H2 WEB CONSOLE (DATABASE DASHBOARD)
# ===================================================================
# Enable browser-based H2 database console UI
spring.h2.console.enabled=true
# Path to open console in browser (http://localhost:8080/h2-console)
spring.h2.console.path=/h2-console

# ===================================================================
# 4. JPA & HIBERNATE (ORM) CONFIGURATION
# ===================================================================
# Tells Hibernate to generate SQL syntax specific to H2 database
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Automatically creates/updates DB tables based on Java @Entity classes
# update = update table schema without deleting existing data
spring.jpa.hibernate.ddl-auto=update

# Print generated SQL queries in terminal logs (great for learning!)
spring.jpa.show-sql=true
# Format SQL nicely in terminal logs instead of one long line
spring.jpa.properties.hibernate.format_sql=true
